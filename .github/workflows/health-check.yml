name: health-check

# Checks every 30 minutes that ouestalex.fr serves the game and that its certificate is not about to expire.
# GitHub turns the schedule off after 60 days without a push: re-enable it in Actions → health-check.
on:
  schedule:
    - cron: '7,37 * * * *' # Off the hour, when GitHub's scheduler runs late the most
  workflow_dispatch: # Allows manual triggering

permissions: {}

jobs:
  check_website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBSITE_URL: ${{ vars.WEBSITE_URL }}

    steps:
      # Retries first, so a passing network glitch does not send an alert.
      - name: Check the game loads
        run: |
          fetch() { curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 "$@"; }
          fetch "$WEBSITE_URL" -o index.html
          if ! grep -q 'id="app"' index.html; then
            echo "::error::$WEBSITE_URL answers but does not serve the game"; exit 1
          fi
          while read -r asset; do
            fetch -o /dev/null "${WEBSITE_URL%/}$asset"
          done < <(grep -oE '/assets/[^"]+\.(js|css)' index.html)
          echo "SUCCESS: $WEBSITE_URL serves the game"

      # certbot renews 30 days ahead: under 14 days left means renewal has been failing for two weeks.
      - name: Check the certificate
        run: |
          host=$(sed -E 's#^https?://([^/:]+).*#\1#' <<< "$WEBSITE_URL")
          cert=$(openssl s_client -connect "$host:443" -servername "$host" < /dev/null 2> /dev/null || true)
          expiry=$(openssl x509 -noout -enddate <<< "$cert" 2> /dev/null | cut -d= -f2)
          if [ -z "$expiry" ]; then
            echo "::error::Could not read the certificate of $host"; exit 1
          fi
          if ! openssl x509 -noout -checkend $((14 * 86400)) <<< "$cert" > /dev/null; then
            echo "::error::The certificate of $host expires on $expiry: certbot did not renew it"; exit 1
          fi
          echo "SUCCESS: certificate of $host valid until $expiry"
